<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>OpenCV.js smoke test</title>
<style>body{font-family:system-ui;margin:2rem}#verdict{font-size:1.3rem;font-weight:700}.pass{color:#18a34a}.fail{color:#e53935}pre{background:#f4f4f4;padding:1rem}</style></head>
<body>
<h1>OpenCV.js smoke test (v2 stack)</h1>
<div id="verdict">Running…</div>
<pre id="log"></pre>
<script type="module">
import { loadOpenCV, requireCV, withMats } from '../web/src/mats.js';

const log = document.getElementById('log');
const verdict = document.getElementById('verdict');
const lines = [];
const say = (s) => { lines.push(s); log.textContent = lines.join('\n'); };
let failed = null;

try {
  await loadOpenCV();
  const cv = requireCV();
  say('runtime ready: cv.Mat = ' + typeof cv.Mat);

  for (const fn of ['adaptiveThreshold', 'GaussianBlur', 'dilate', 'morphologyEx', 'warpAffine',
                    'getRotationMatrix2D', 'connectedComponentsWithStats', 'bitwise_or', 'subtract',
                    'getStructuringElement', 'resize', 'imshow', 'imread']) {
    if (typeof cv[fn] !== 'function') { failed = 'cv.' + fn + ' missing'; break; }
  }
  say(failed ? failed : 'pipeline functions: all present');

  if (!failed && typeof cv.CLAHE !== 'function') failed = 'cv.CLAHE missing';
  if (!failed) {
    const clahe = new cv.CLAHE(2.0, new cv.Size(8, 8));
    clahe.delete();
    say('CLAHE: OK');
    await withMats(async (scope) => {
      const m = scope.track(new cv.Mat(16, 16, cv.CV_8UC1, new cv.Scalar(0)));
      const labels = scope.track(new cv.Mat()), stats = scope.track(new cv.Mat()), cents = scope.track(new cv.Mat());
      const n = cv.connectedComponentsWithStats(m, labels, stats, cents, 8, cv.CV_32S);
      say('connectedComponentsWithStats roundtrip: n=' + n);
    });
  }
} catch (e) {
  failed = failed || 'exception';
  say('EXCEPTION: ' + (e.stack || e.message));
}

verdict.textContent = failed ? 'SMOKE FAIL — ' + failed : 'SMOKE PASS';
verdict.className = failed ? 'fail' : 'pass';
document.title = failed ? 'SMOKE FAIL' : 'SMOKE PASS';
</script>
</body>
</html>
