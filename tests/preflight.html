<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>preflight module</title>
<style>body{font-family:system-ui;margin:2rem}#verdict{font-size:1.3rem;font-weight:700}.pass{color:#18a34a}.fail{color:#e53935}pre{background:#f4f4f4;padding:1rem}</style></head>
<body>
<h1>preflight.js</h1>
<div id="verdict">Running…</div>
<pre id="log"></pre>
<script type="module">
import { evaluatePreflight } from '../web/src/preflight.js';
import { loadOpenCV, withMats } from '../web/src/mats.js';
import { decodeToCanvas } from '../web/src/decode.js';
import { preprocess } from '../web/src/preprocess.js';
import { segmentLines } from '../web/src/segment.js';

const log = document.getElementById('log');
const lines = [];
const say = (s) => { lines.push(s); log.textContent = lines.join('\n'); };
let failed = null;
const ids = (w) => w.map((x) => x.id);
const assertIds = (signals, want, name) => {
  const got = ids(evaluatePreflight(signals));
  const ok = JSON.stringify(got) === JSON.stringify(want);
  say(`${ok ? 'ok  ' : 'FAIL'} ${name}: got=${JSON.stringify(got)} want=${JSON.stringify(want)}`);
  if (!ok && !failed) failed = name;
};

// --- unit table (boundaries matter) -------------------------------------
assertIds({ skewAngle: 0, lines: 0, textHeight: 30 }, ['no-lines'], 'zero lines');
assertIds({ skewAngle: 6, lines: 0, textHeight: 5 }, ['no-lines'], 'no-lines short-circuits');
assertIds({ skewAngle: 0, lines: 1, textHeight: 30 }, ['one-line'], 'one line');
assertIds({ skewAngle: 0, lines: 2, textHeight: 30 }, [], 'two lines clean');
assertIds({ skewAngle: 4.4, lines: 5, textHeight: 30 }, [], 'tilt below threshold');
assertIds({ skewAngle: 4.5, lines: 5, textHeight: 30 }, ['tilted'], 'tilt at threshold');
assertIds({ skewAngle: -5.2, lines: 5, textHeight: 30 }, ['tilted'], 'negative tilt');
assertIds({ skewAngle: 0, lines: 5, textHeight: 11.9 }, ['small-text'], 'small text');
assertIds({ skewAngle: 0, lines: 5, textHeight: 12 }, [], 'text at threshold');
assertIds({ skewAngle: 5, lines: 1, textHeight: 5 }, ['one-line', 'tilted', 'small-text'], 'stacked order');
(() => {
  const w = evaluatePreflight({ skewAngle: 0, lines: 0, textHeight: 30 })[0];
  const ok = w.severity === 'warn' && /retake/i.test(w.message);
  say(`${ok ? 'ok  ' : 'FAIL'} no-lines shape: ${JSON.stringify(w)}`);
  if (!ok && !failed) failed = 'no-lines shape';
})();

// --- calibration: text fixtures + sample stay silent; the no-text fixture
// must fire exactly no-lines. Thresholds move, fixtures don't. -------------
try {
  await loadOpenCV();
  const expected = await (await fetch('./fixtures/pages/expected.json')).json();
  const cases = Object.entries(expected).map(([name, exp]) =>
    [`./fixtures/pages/${name}.jpg`, name, exp.lines]);
  cases.push(['../web/samples/sample_page.jpg', 'sample_page', 16]);
  for (const [url, name, expLines] of cases) {
    const blob = await (await fetch(url)).blob();
    const canvas = await decodeToCanvas(blob, 2000);
    const signals = await withMats(async (scope) => {
      const pre = preprocess(canvas, scope);
      const segs = segmentLines(pre, scope);
      return { skewAngle: pre.skewAngle, lines: segs.length, textHeight: pre.textHeight };
    });
    const got = ids(evaluatePreflight(signals));
    const want = expLines === 0 ? ['no-lines'] : [];
    const ok = JSON.stringify(got) === JSON.stringify(want);
    say(`${ok ? 'ok  ' : 'FAIL'} calib ${name}: skew=${signals.skewAngle} lines=${signals.lines} ` +
        `textHeight=${signals.textHeight} warnings=${JSON.stringify(got)}`);
    if (!ok && !failed) failed = 'calib ' + name;
  }
} catch (e) {
  failed = failed || 'exception';
  say('EXCEPTION: ' + (e.stack || e.message));
}

const verdict = document.getElementById('verdict');
verdict.textContent = failed ? 'PREFLIGHT FAIL — ' + failed : 'PREFLIGHT PASS';
verdict.className = failed ? 'fail' : 'pass';
document.title = failed ? 'PREFLIGHT FAIL' : 'PREFLIGHT PASS';
</script>
</body>
</html>
