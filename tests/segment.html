<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>segment module</title>
<style>body{font-family:system-ui;margin:2rem}#verdict{font-size:1.3rem;font-weight:700}.pass{color:#18a34a}.fail{color:#e53935}pre{background:#f4f4f4;padding:1rem}canvas{max-width:100%;border:1px solid #ddd;margin:2px 0}</style></head>
<body>
<h1>segment.js</h1>
<div id="verdict">Running…</div>
<pre id="log"></pre>
<div id="previews"></div>
<script type="module">
import { loadOpenCV, withMats } from '../web/src/mats.js';
import { decodeToCanvas } from '../web/src/decode.js';
import { preprocess } from '../web/src/preprocess.js';
import { segmentLines } from '../web/src/segment.js';

const log = document.getElementById('log');
const verdict = document.getElementById('verdict');
const lines = [];
const say = (s) => { lines.push(s); log.textContent = lines.join('\n'); };
let failed = null;

try {
  await loadOpenCV();
  const expected = await (await fetch('./fixtures/pages/expected.json')).json();
  for (const [name, exp] of Object.entries(expected)) {
    const blob = await (await fetch(`./fixtures/pages/${name}.jpg`)).blob();
    const canvas = await decodeToCanvas(blob, 2000);
    const got = await withMats(async (scope) => {
      const pre = preprocess(canvas, scope);
      const segs = segmentLines(pre, scope);
      if (name === '07_realistic_combo') {
        const p = document.getElementById('previews');
        for (const s of segs.slice(0, 3)) p.appendChild(s.canvas);
      }
      return segs.length;
    });
    // Zero-line pages (illustrations, non-text) must be EXACTLY zero — a
    // single phantom band becomes phantom words downstream.
    const ok = exp.lines === 0 ? got === 0 : Math.abs(got - exp.lines) <= 2;
    say(`${ok ? 'ok  ' : 'FAIL'} ${name}: lines=${got} expected=${exp.lines}${exp.lines === 0 ? ' exactly' : '±2'}`);
    if (!ok && !failed) failed = name;
  }
} catch (e) {
  failed = failed || 'exception';
  say('EXCEPTION: ' + (e.stack || e.message));
}

verdict.textContent = failed ? 'SEGMENT FAIL — ' + failed : 'SEGMENT PASS';
verdict.className = failed ? 'fail' : 'pass';
document.title = failed ? 'SEGMENT FAIL' : 'SEGMENT PASS';
</script>
</body>
</html>
