<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>recognize module</title>
<style>body{font-family:system-ui;margin:2rem}#verdict{font-size:1.3rem;font-weight:700}.pass{color:#18a34a}.fail{color:#e53935}pre{background:#f4f4f4;padding:1rem;white-space:pre-wrap}</style></head>
<body>
<h1>recognize.js — full pipeline on one page</h1>
<div id="verdict">Running…</div>
<pre id="log"></pre>
<script>
window.__consoleLog = [];
for (const level of ['warn', 'error']) {
  const orig = console[level].bind(console);
  console[level] = (...a) => {
    window.__consoleLog.push(level + ': ' + a.map((x) => (x && x.stack) || String(x)).join(' '));
    orig(...a);
  };
}
</script>
<script type="module">
import { loadOpenCV, withMats } from '../web/src/mats.js';
import { decodeToCanvas } from '../web/src/decode.js';
import { preprocess } from '../web/src/preprocess.js';
import { segmentLines } from '../web/src/segment.js';
import { loadModel, recognizeLines, lastError } from '../web/src/recognize.js';
import { countWords } from '../web/src/count.js';

const log = document.getElementById('log');
const verdict = document.getElementById('verdict');
const lines = [];
const say = (s) => { lines.push(s); log.textContent = lines.join('\n'); };
let failed = null;

try {
  await loadOpenCV();
  say('opencv ready; loading model…');
  const t0 = performance.now();
  await loadModel((p) => {
    if (p.status === 'progress' && p.file && p.file.endsWith('.onnx')) {
      say(`  fetch ${p.file}: ${Math.round(p.progress || 0)}%`);
      lines.pop(); // keep the log short: overwrite progress lines
    }
  });
  say(`model ready in ${((performance.now() - t0) / 1000).toFixed(1)}s`);

  const blob = await (await fetch('./fixtures/pages/01_clean_print_like.jpg')).blob();
  const canvas = await decodeToCanvas(blob, 2000);
  const crops = await withMats(async (scope) => {
    const pre = preprocess(canvas, scope);
    return segmentLines(pre, scope).map((s) => s.canvas);
  });
  say(`${crops.length} line crops`);

  const t1 = performance.now();
  const transcripts = await recognizeLines(crops, (i, n) => {});
  const totalMs = performance.now() - t1;
  const { total } = countWords(transcripts);
  const msPerLine = Math.round(totalMs / crops.length);

  say(`words=${total} (true 189)  ${msPerLine}ms/line  total=${(totalMs / 1000).toFixed(1)}s`);
  say(`sample: "${transcripts[1] || ''}"`);

  const err = Math.abs(total - 189) / 189;
  if (err > 0.10) failed = `word count off by ${(err * 100).toFixed(1)}%`;
  if (failed && lastError) say('lastError: ' + (lastError.stack || lastError.message));
  if (failed && window.__consoleLog.length) say('--- console ---\n' + window.__consoleLog.slice(0, 10).join('\n'));
  if (totalMs > 30000) failed = failed || `too slow: ${(totalMs / 1000).toFixed(1)}s`;

  // v8: resume-prior skips inference entirely for seeded lines.
  {
    let fired = 0;
    const seeded = await recognizeLines([null], () => { fired++; }, ['seeded line']);
    const ok = JSON.stringify(seeded) === JSON.stringify(['seeded line']) && fired === 0;
    say(`${ok ? 'ok  ' : 'FAIL'} prior skip: out=${JSON.stringify(seeded)} onLine fired=${fired}`);
    if (!ok && !failed) failed = 'prior skip';
  }
  // v8: consumed crops are released (slot nulled, length preserved).
  {
    const c = document.createElement('canvas'); c.width = 100; c.height = 32;
    c.getContext('2d').fillStyle = '#fff'; c.getContext('2d').fillRect(0, 0, 100, 32);
    const arr = [c];
    const out = await recognizeLines(arr, null);
    const ok = arr.length === 1 && arr[0] === null && out.length === 1 && typeof out[0] === 'string';
    say(`${ok ? 'ok  ' : 'FAIL'} crop release: slot=${arr[0]} len=${arr.length} out=${JSON.stringify(out)}`);
    if (!ok && !failed) failed = 'crop release';
  }
} catch (e) {
  failed = failed || 'exception';
  say('EXCEPTION: ' + (e.stack || e.message));
}

verdict.textContent = failed ? 'RECOGNIZE FAIL — ' + failed : 'RECOGNIZE PASS';
verdict.className = failed ? 'fail' : 'pass';
document.title = failed ? 'RECOGNIZE FAIL' : 'RECOGNIZE PASS';
</script>
</body>
</html>
